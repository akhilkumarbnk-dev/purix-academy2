name: purix_academy
description: "Purix Academy - Smart learning platform for CBSE students"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # URL Launcher
  url_launcher: ^6.2.0
  
  # Google Authentication
  google_sign_in: ^6.1.0
  
  # Fonts
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.2
  
  # Date & Time
  intl: ^0.19.0
  
  # PDF Viewer
  flutter_pdfview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true